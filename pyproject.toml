[project]
name = "smallcap"
version = "0.1.0"
description = "Free-data small-cap research toolkit: prediction log, dilution tracker, runway calculator, screener — built on SEC XBRL."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "yfinance>=0.2.40",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
smallcap = "smallcap.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["smallcap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
